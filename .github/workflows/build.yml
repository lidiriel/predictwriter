# Test, lint and package the LibreOffice extension.
#
# - Every push and pull request: tests on every Python that LibreOffice uses
#   (3.8-3.13, Linux, plus Windows), lint, and the .oxt as a downloadable
#   artifact of the run ("Actions" tab).
# - A tag "v<major>.<minor>" (e.g. v1.2): it *is* the version (tools/build_oxt.py
#   reads it with git describe); also creates a GitHub Release with the .oxt.
name: Build extension

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # One entry per Python that runs the extension for some users. On Linux
    # LibreOffice uses the system Python; on Windows/macOS it bundles its own
    # (versions checked in LibreOffice's download.lst and packages.debian.org /
    # packages.ubuntu.com, November 2026).
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Python 3.8 - LibreOffice 7.4-24.2 on Windows/macOS"
            python: "3.8"
            os: ubuntu-latest
          - label: "Python 3.9 - LibreOffice 24.8 on Windows/macOS"
            python: "3.9"
            os: ubuntu-latest
          - label: "Python 3.10 - Ubuntu 22.04 (LibreOffice 7.3)"
            python: "3.10"
            os: ubuntu-22.04
          - label: "Python 3.11 - Debian 12 (LibreOffice 7.4)"
            python: "3.11"
            os: ubuntu-latest
          - label: "Python 3.12 - Ubuntu 24.04 (LibreOffice 24.2)"
            python: "3.12"
            os: ubuntu-latest
          - label: "Python 3.13 - Debian 13 (LibreOffice 25.2)"
            python: "3.13"
            os: ubuntu-latest
          - label: "Windows - Python 3.10 (LibreOffice 25.2)"
            python: "3.10"
            os: windows-latest
          - label: "Windows - Python 3.12 (LibreOffice 26.2)"
            python: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.10.1 pyflakes==4.1.0
      # pyproject.toml excludes the vendored pressagio from black.
      - run: black --check extension tools tests
      - run: pyflakes extension/python/pythonpath/predictive extension/python/main.py tools tests

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create a release on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history and tags: the version comes from the last vX.Y tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the version (last vX.Y tag)
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "tools")
          import build_oxt
          version, origin = build_oxt.resolve_version(build_oxt.ROOT / "extension")
          print("version=%s" % version)
          print("tag=%s" % (origin.get("tag") or ""))
          print("since=%s" % origin.get("commits_since_tag", ""))
          PY
          cat "$GITHUB_OUTPUT"
      - name: Check that the pushed tag is the version tag of this commit
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ steps.version.outputs.tag }}" ] || [ "${{ steps.version.outputs.since }}" != "0" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not the v<major>.<minor> tag of this commit (found ${{ steps.version.outputs.tag }} + ${{ steps.version.outputs.since }} commits)"
            exit 1
          fi
      - name: Build the .oxt
        run: python tools/build_oxt.py
      - uses: actions/upload-artifact@v4
        with:
          name: predictive-writer-${{ steps.version.outputs.version }}
          path: dist/*.oxt
          if-no-files-found: error
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.oxt \
            --title "Predictive Writer ${{ steps.version.outputs.version }}" \
            --notes "Install: close LibreOffice, then \`unopkg add -f predictive-writer-${{ steps.version.outputs.version }}.oxt\` (or Tools > Extension Manager > Add). See the README for prerequisites (python3-uno on Debian/Ubuntu)."
